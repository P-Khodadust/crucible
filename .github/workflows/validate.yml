name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JSON configs parse
        run: for f in $(git ls-files '*.json'); do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }; done
      - name: Scripts have valid syntax
        run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
